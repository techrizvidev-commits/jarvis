name: Build Jarvis APK (Android)
# Wraps ui/mobile.html + ui/index.html with Capacitor, builds a debug APK.
# Needs: Node 20, Java 17, Android SDK (all on ubuntu-latest runner).
# The APK talks to your laptop server on the same Wi-Fi - set the server
# address in mobile-app/capacitor.config.json (server.url) if needed.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: python3 decode_assets.py
      - run: |
          cp ui/index.html mobile-app/www/desktop.html
          cd mobile-app && npm ci && (npx cap add android || true) && npx cap sync android
      - run: cd mobile-app/android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: Jarvis-Android-apk, path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk}
